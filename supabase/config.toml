project_id = "learnlytics-llh-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:4188/Learnlytics.notes"
additional_redirect_urls = ["http://127.0.0.1:4188/Learnlytics.notes/llh.html"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 3600

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email.template.confirmation]
subject = "Confirm your LearnLytics account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your LearnLytics password"
content_path = "./supabase/templates/recovery.html"

[functions.llh-resource-access]
# Gateway verification supports different key versions differently; handler verifies with Auth.getUser.
verify_jwt = false
